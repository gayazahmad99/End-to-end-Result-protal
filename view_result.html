<!DOCTYPE html>
<html>
<head>
<title>View Result</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#eef2f3,#dfe9f3);
}

/* HEADER */
.header {
    background: linear-gradient(90deg,#ff9800,#ff5722);
    padding: 15px;
    text-align: center;
    font-size: 26px;
    color: white;
    border-radius: 8px;
    margin: 20px;
}

/* CONTAINER */
.container {
    text-align: center;
    padding: 20px;
}

/* INPUT */
input {
    padding: 10px;
    width: 250px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

/* TABLE */
table {
    margin: auto;
    margin-top: 25px;
    width: 90%;
    border-collapse: collapse;
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

th {
    background: #0d6efd;
    color: white;
    padding: 12px;
}

td {
    padding: 10px;
}

tr:hover {
    background: #f1f1f1;
}

/* DASHBOARD BUTTON */
.dashboard-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    background: #0d6efd;
    color: white;
    padding: 12px 15px;
    border-radius: 50%;
    text-decoration: none;
    font-size: 18px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    transition: 0.3s;
}

.dashboard-btn:hover {
    background: black;
    transform: scale(1.1);
}
</style>
</head>

<body>

<!-- DASHBOARD BUTTON -->
<a href="/dashboard" class="dashboard-btn" title="Go to Dashboard">🏠</a>

<div class="header">View Student Results</div>

<div class="container">

<form method="POST" class="mb-3">
    <label><b>Search By Roll No</b></label><br><br>

    <input type="text" name="roll" placeholder="Enter Roll No">

    <button class="btn btn-primary">Search</button>

    <!-- FIXED BUTTON (no nested button issue) -->
    <a href="/view_result" class="btn btn-secondary">Clear</a>
</form>

<table>
<tr>
    <th>Roll No</th>
    <th>Name</th>
    <th>Course</th>
    <th>Marks</th>
    <th>Total Marks</th>
    <th>Percentage</th>
</tr>

{% for r in results %}
<tr>
    <td>{{ r[0] }}</td>
    <td>{{ r[1] }}</td>
    <td>{{ r[2] }}</td>
    <td>{{ r[3] }}</td>
    <td>{{ r[4] }}</td>
    <td>{{ "%.2f"|format(r[5]) }}%</td>
</tr>
{% endfor %}

</table>

</div>

</body>
</html>
