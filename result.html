<!DOCTYPE html>
<html>
<head>
    <title>Add Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg,#eef2f3,#dfe9f3);
            font-family: 'Segoe UI';
        }

        .card {
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .header {
            background: linear-gradient(90deg,#0d6efd,#6610f2);
            color: white;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 22px;
        }

        /* 🔥 Dashboard Button */
        .dashboard-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #0d6efd;
            color: white;
            padding: 10px 14px;
            border-radius: 50%;
            text-decoration: none;
        }
        .dashboard-btn:hover {
            background: black;
            transform: scale(1.15) rotate(5deg);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .preview {
            margin-top: 20px;
            padding: 15px;
            background: white;
            border-radius: 10px;
            display: none;
        }
    </style>
</head>

<body>

<!-- Dashboard -->
<a href="/dashboard" class="dashboard-btn">🏠</a>

<div class="container mt-5">
<div class="row justify-content-center">
<div class="col-md-6">

<div class="card p-4">

<div class="header mb-3">
    📊 Add Student Result
</div>

<form method="POST" action="/result">

    <!-- 🔥 SELECT STUDENT -->
    <div class="mb-3">
        <label>Select Student (Roll No)</label>
        <select id="studentSelect" class="form-control" onchange="fillData()" required>
            <option value="">Select</option>
            {% for s in students %}
            <option value="{{ s[0] }}"
                    data-name="{{ s[2] }}"
                    data-course="{{ s[3] }}">
                {{ s[1] }}
            </option>
            {% endfor %}
        </select>
    </div>

    <!-- 🔥 IMPORTANT FIELD -->
    <input type="hidden" name="student_id" id="student_id">

    <!-- NAME -->
    <div class="mb-3">
        <label>Name</label>
        <input type="text" id="name" class="form-control" readonly>
    </div>

    <!-- COURSE -->
    <div class="mb-3">
        <label>Course</label>
        <input type="text" id="course" class="form-control" readonly>
    </div>

    <!-- MARKS -->
    <div class="row mb-3">
        <div class="col">
            <input type="number" name="obtained_marks" id="obtained_marks" class="form-control" placeholder="Obtained Marks" oninput="calc()" required>
        </div>
        <div class="col">
            <input type="number" name="total_marks" id="total_marks" class="form-control" placeholder="Total Marks" oninput="calc()" required>
        </div>
    </div>

    <button class="btn btn-success w-100">Save Result</button>

</form>

<!-- 🔥 PREVIEW -->
<div class="preview" id="preview">
    <h5>🎓 Result Preview</h5>
    <p><strong>Name:</strong> <span id="p_name"></span></p>
    <p><strong>Course:</strong> <span id="p_course"></span></p>
    <p><strong>Marks:</strong> <span id="p_marks"></span></p>
    <p><strong>Percentage:</strong> <span id="p_per"></span></p>
</div>

</div>
</div>
</div>
</div>

<script>

// 🔥 AUTO FILL (SAFE VERSION)
function fillData(){
    let select = document.getElementById("studentSelect");
    let opt = select.options[select.selectedIndex];

    let id = opt.value;
    let name = opt.getAttribute("data-name") || "";
    let course = opt.getAttribute("data-course") || "";

    document.getElementById("student_id").value = id;
    document.getElementById("name").value = name;
    document.getElementById("course").value = course;

    document.getElementById("p_name").innerText = name;
    document.getElementById("p_course").innerText = course;
}

// 🔥 CALCULATE (SAFE VERSION)
function calc(){
    let o = document.getElementById("obtained_marks").value;
    let t = document.getElementById("total_marks").value;

    if(o && t && t != 0){
        let per = (o/t)*100;

        document.getElementById("preview").style.display = "block";
        document.getElementById("p_marks").innerText = o + " / " + t;
        document.getElementById("p_per").innerText = per.toFixed(2) + "%";
    }
}

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
