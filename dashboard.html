<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

        <!-- ✅ YAHAN ADD KARNA HAI -->

<link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #eef2f3, #dfe9f3);
}

/* HEADER */
.header {
    background: linear-gradient(90deg, #0a4d68, #1c6ea4);
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 1px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

/* MENU */
.menu {
    display: flex;
    justify-content: space-around;
    background: white;
    padding: 10px;
    box-shadow: 0 5px 10px rgba(0,0,0,0.1);
}

.menu a {
    text-decoration: none;
    padding: 10px 18px;
    border-radius: 8px;
    background: #0a4d68;
    color: white;
    font-weight: 500;
    transition: 0.3s;
}

.menu a:hover {
    background: #000;
    transform: scale(1.05);
}

/* BUTTONS */
button {
    background: darkgrey;
    color: white;
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

/* MAIN */
.container {
    display: flex;
    padding: 20px;
}

/* LEFT */
.left {
    width: 28%;
}

.left img {
    width: 95%;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

/* RIGHT */
.right {
    width: 75%;
    padding-left: 8px;
}

/* BANNER */
.banner img {
    width: 100%;
    height: 350px;
    object-fit: cover;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.2);
}

/* CARDS */
.cards {
    display: flex;
    justify-content: space-between;
    margin-top: 25px;
    gap: 15px;
}

.card {
    width: 32%;
    padding: 18px;
    color: #fff;
    text-align: center;
    font-size: 20px;
    border-radius: 14px;

    /* 🔥 BORDER */
    border: 2px solid rgba(255,255,255,0.2);

    /* 🔥 GLASS + SHADOW */
    background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
    backdrop-filter: blur(8px);

    box-shadow: 0 10px 25px rgba(0,0,0,0.25);

    transition: all 0.3s ease;
}


.card:hover {
    transform: translateY(-10px) scale(1.04);
    box-shadow: 0 15px 35px rgba(0,0,0,0.4);

    /* glow effect */
    border: 5px solid #6C5CE7;
}



.card1 { background: linear-gradient(135deg, #ff4d00, #ff7a18); }
.card2 { background: linear-gradient(135deg, #1c6ea4, #3498db); }
.card3 { background: linear-gradient(135deg, #0a8f6a, #2ecc71); }

</style>
</head>

<body>

<div class="header">
    🎓 Student Result Management System
</div>

<div class="menu">
    <a href="/course">📚 Course</a>
    <a href="/student">👨‍🎓 Student</a>
    <a href="/result">📊 Result</a>
    <a href="/view_result">📄 View Result</a>

    <a href="/logout"><button>🚪 Logout</button></a>
    <a href="/exit"><button>Exit</button></a>
</div>

<script>
function Logout(){
    return confirm("⚠️ Are you sure you want to logout?");
}

function Exit(){
    return confirm("⚠️ Are you sure you want to exit?");
}
</script>

<div class="container">

    <!-- LEFT SIDE -->
    <div class="left">
        <img src="{{ url_for('static', filename='images/left.jpeg') }}" alt="Clock">
    </div>

    <!-- RIGHT SIDE -->
    <div class="right">

        <!-- FIXED STATIC IMAGE -->
        <div class="banner">
            <img src="{{ url_for('static', filename='images/right.jpeg') }}" alt="Banner">
        </div>

        <div class="cards">

            <div class="card card1">
               👨‍🎓 Total Students <br><br>
                <strong>[ {{ total_students }} ]</strong>
            </div>

            <div class="card card2">
                📚 Total Course <br><br>
                <strong>[ {{ total_courses }} ]</strong>
            </div>

            <div class="card card3">
                📊 Total Results <br><br>
                <strong>[ {{ total_results }} ]</strong>
            </div>

        </div>

    </div>

</div>


</body>
</html>
